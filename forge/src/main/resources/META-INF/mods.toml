[[mods]]
modId = "smallships_addon"
version = "${version}"
displayName = "SmallShips Addon Example"
description = '''Reference addon for SmallShips: adds the Crayer without any change to the main mod.'''

# the addon needs the main mod to be there BEFORE it registers its ship type
[[dependencies.smallships_addon]]
modId = "smallships"
mandatory = true
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.smallships_addon]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,1.22)"
ordering = "NONE"
side = "BOTH"
