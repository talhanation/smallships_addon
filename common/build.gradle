architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/smallships_addon.accesswidener")
}

dependencies {
    modImplementation "com.talhanation:smallships-common:${rootProject.smallships_version}"

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    compileOnly "com.electronwill.night-config:core:${rootProject.night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${rootProject.night_config_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-common:${rootProject.forge_config_api_port_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}