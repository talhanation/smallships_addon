architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/smallships_addon.accesswidener")
}

dependencies {
    // Small Ships has no common jar on Modrinth. The fabric jar carries the common classes too,
    // so common only compiles against it - each platform brings its own jar.
    modCompileOnly "maven.modrinth:${rootProject.smallships_modrinth_id}:${rootProject.smallships_fabric_version}"

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    compileOnly "com.electronwill.night-config:core:${rootProject.night_config_version}"
    compileOnly "com.electronwill.night-config:toml:${rootProject.night_config_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-common:${rootProject.forge_config_api_port_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}